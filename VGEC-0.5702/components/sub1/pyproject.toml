[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vgec-sub1"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["PyYAML==6.0.3"]

[project.optional-dependencies]
modal = ["modal>=1.6,<2"]
test = ["torch==2.8.0", "transformers==4.57.1", "sentencepiece==0.2.1", "numpy==2.2.6", "safetensors==0.6.2"]

[project.scripts]
vgec-sub1 = "vgec_sub1.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vgec_sub1 = ["defaults.yaml"]
